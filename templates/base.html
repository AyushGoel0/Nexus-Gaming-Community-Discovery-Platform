<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nexus{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container nav-container">
            <a class="brand" href="{% url 'core:index' %}">Nexus</a>
            <nav class="site-nav" aria-label="Primary navigation">
                <a href="{% url 'core:index' %}">Home</a>
                <a href="{% url 'core:game_list' %}">Games</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}">Profile</a>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button class="nav-button" type="submit">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">Log in</a>
                    <a class="nav-cta" href="{% url 'accounts:register' %}">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
